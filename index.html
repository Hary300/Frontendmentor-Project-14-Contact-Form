<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Mentor | Contact form</title>
    <link rel="stylesheet" href="./src/output.css" />

    <script src="./script.js" defer></script>
  </head>
  <body
    class="bg-green-lighter text-grey-darker px-4 py-6 font-karla flex flex-col justify-center items-center md:min-h-screen gap-2"
  >
    <div
      class="relative container p-5 md:p-7 rounded-lg bg-white flex flex-col gap-6 max-w-135"
    >
      <header>
        <h1 class="text-2xl font-bold">Contact Us</h1>
      </header>
      <main>
        <form class="flex flex-col gap-2">
          <!-- Name -->
          <div
            class="name flex flex-col md:flex-row justify-between gap-4 md:gap-2"
          >
            <!-- first name -->
            <label for="first-name-input" class="text-field">
              <span class="text-field__label"
                >First Name <span class="text-field__required">*</span></span
              >
              <input
                type="text"
                id="first-name-input"
                class="text-field__input"
              />
              <p class="field__error">This field is required</p>
            </label>

            <!-- last name -->
            <label for="last-name-input" class="text-field">
              <span class="text-field__label"
                >Last Name <span class="text-field__required">*</span></span
              >
              <input
                type="text"
                id="last-name-input"
                class="text-field__input"
              />
              <p class="field__error">This field is required</p>
            </label>
          </div>

          <!-- Email Address -->
          <label for="email-input" class="text-field">
            <span class="text-field__label">
              Email Address <span class="text-field__required">*</span>
            </span>
            <input type="email" id="email-input" class="text-field__input" />
            <p class="field__error">Please enter a valid email address</p>
          </label>

          <!-- Query Type -->
          <fieldset class="radio-field">
            <legend class="text-field__label">
              Query Type <span class="text-field__required">*</span>
            </legend>

            <div class="flex flex-col md:flex-row gap-2">
              <label for="general" class="radio-option">
                <input
                  type="radio"
                  id="general"
                  name="query-type"
                  value="general-enquiry"
                  class="accent-green-medium"
                />
                General Enquiry
              </label>

              <label for="support" class="radio-option">
                <input
                  type="radio"
                  id="support"
                  name="query-type"
                  value="support-request"
                  class="accent-green-medium"
                />
                Support Request
              </label>
            </div>

            <p class="field__error">Please select a query type</p>
          </fieldset>

          <!-- Message -->
          <label for="message-input" class="text-field"
            ><span class="text-field__label"
              >Message <span class="text-field__required">*</span></span
            >
            <textarea
              type="text"
              id="message-input"
              class="text-field__input"
              rows="5"
            ></textarea>
            <p class="field__error">This field is required</p>
          </label>

          <!-- Checkbox -->
          <fieldset class="checkbox-field">
            <label
              for="consent-input"
              class="checkbox-option flex gap-3 items-center cursor-pointer"
            >
              <input
                type="checkbox"
                id="consent-input"
                name="consent"
                value="yes"
                class="accent-green-medium"
              />
              <span class="text-field__label"
                >I consent to being contacted by the team
                <span class="text-field__required">*</span></span
              >
            </label>
            <p class="field__error">
              To submit this form please consent to being contacted
            </p>
          </fieldset>

          <!-- Submit button -->
          <button
            id="submit-button"
            type="submit"
            class="bg-green-medium rounded-lg text-white py-1.5 cursor-pointer shadow-[0_0_4px_rgba(0,0,0,0.3)] transition-all active:shadow-none disabled:bg-gray-400 disabled:pointer-events-none"
          >
            Submit
          </button>
        </form>
      </main>

      <!-- Success Toast -->
      <div class="toast success-toast">
        <div class="flex gap-1 items-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="none"
            viewBox="0 0 20 21"
          >
            <path
              fill="#fff"
              d="M14.28 7.72a.748.748 0 0 1 0 1.06l-5.25 5.25a.748.748 0 0 1-1.06 0l-2.25-2.25a.75.75 0 1 1 1.06-1.06l1.72 1.72 4.72-4.72a.75.75 0 0 1 1.06 0Zm5.47 2.78A9.75 9.75 0 1 1 10 .75a9.76 9.76 0 0 1 9.75 9.75Zm-1.5 0A8.25 8.25 0 1 0 10 18.75a8.26 8.26 0 0 0 8.25-8.25Z"
            />
          </svg>
          <p class="text-white">Message Sent!</p>
        </div>
        <p class="text-xs text-white/80">
          Thanks for completing the form. We'll be in touch soon!
        </p>
      </div>

      <!-- Fail Toast -->
      <div class="toast fail-toast">
        <div class="flex gap-1 items-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            fill="none"
            viewBox="0 0 20 21"
          >
            <path
              fill="#d73c3c"
              d="M14.28 7.72a.748.748 0 0 1 0 1.06l-5.25 5.25a.748.748 0 0 1-1.06 0l-2.25-2.25a.75.75 0 1 1 1.06-1.06l1.72 1.72 4.72-4.72a.75.75 0 0 1 1.06 0Zm5.47 2.78A9.75 9.75 0 1 1 10 .75a9.76 9.76 0 0 1 9.75 9.75Zm-1.5 0A8.25 8.25 0 1 0 10 18.75a8.26 8.26 0 0 0 8.25-8.25Z"
            />
          </svg>
          <p class="text-red-500">Failed to sent!</p>
        </div>
        <p class="text-xs text-red-500/80">Please try again!</p>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/Hary300" target="_blank">Hary300</a>.
    </footer>
  </body>
</html>
